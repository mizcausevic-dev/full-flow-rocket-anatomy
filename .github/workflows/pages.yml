name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Materialize hero image
        run: |
          if [ ! -s public/hero-editorial.jpg ]; then
            base64 -d public/hero-editorial.b64 > public/hero-editorial.jpg
          fi

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build:pages

      - name: Publish the pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          cp -a out/. "$work/"
          cd "$work"
          git init
          git checkout -b pages
          git add -A
          git commit -m "Publish sectional explainer"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:pages

      - name: Set repository topics and description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /tmp/topics.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
            -d '{"names":["aerospace","rocket-engine","staged-combustion","full-flow","raptor","methalox","explainer","visualization","turbopump","education"]}' \
            | grep -E '200|201|204|422' || echo "Topic update skipped."
          curl -sS -o /tmp/repo.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"description":"Sectional, frame-driven explainer of a full-flow staged combustion rocket engine.","homepage":"https://mizcausevic-dev.github.io/full-flow-rocket-engine-explainer/"}' \
            | grep -E '200|201|204' || echo "Description update skipped."
